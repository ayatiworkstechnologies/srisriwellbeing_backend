services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: srisri_wellbeing
      POSTGRES_USER: srisri
      POSTGRES_PASSWORD: srisri
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srisri -d srisri_wellbeing"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://srisri:srisri@db:5432/srisri_wellbeing
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
